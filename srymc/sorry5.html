<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I’m Sorry Kittu</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #f7e7ef, #e7e8ff);
        height: 100vh;
        overflow: hidden;
        position: relative;
    }

    .page {
        display: none;
        width: 100%;
        height: 100%;
    }

    .active {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .heart {
        position: absolute;
        font-size: 38px;
        opacity: 0.17;
        animation: float 6s infinite ease-in-out;
        pointer-events: none;
    }

    @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-25px); }
        100% { transform: translateY(0px); }
    }

    .card {
        width: 330px;
        padding: 20px;
        border-radius: 28px;
        background: #ffffffdd;
        box-shadow: 0 10px 35px rgba(0,0,0,0.18);
        text-align: center;
        backdrop-filter: blur(10px);
        z-index: 10;
    }

    .top-box {
        width: 100%;
        height: 170px;
        border-radius: 22px;
        background: linear-gradient(180deg, #e5d6ff, #d5c2ff);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        margin-bottom: 14px;
    }

    .top-box img {
        width: 150px;
        height: auto;
        animation: sadMove 2.2s infinite ease-in-out;
    }

    @keyframes sadMove {
        0% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
        100% { transform: translateY(0); }
    }

    h2 {
        font-size: 18px;
        margin: 12px 0;
        color: #5a4b4b;
        font-weight: 500;
    }

    .btn {
        margin-top: 20px;
        padding: 12px 20px;
        width: 80%;
        background: #c8b3ff;
        border: none;
        font-size: 15px;
        font-weight: 600;
        border-radius: 20px;
        cursor: pointer;
        color: #3c2c59;
        box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        transition: 0.2s;
    }

    .btn:hover {
        transform: scale(1.03);
    }

    /* Page 2 */
    .cat-img { width: 180px; animation: move 2.2s infinite; }
    @keyframes move {
        0% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
        100% { transform: translateY(0); }
    }

    /* Page 3 */
    .cute-gif { width: 170px; animation: swing 1.8s infinite; }
    @keyframes swing {
        0% { transform: rotate(0); }
        50% { transform: rotate(4deg); }
        100% { transform: rotate(0); }
    }

    /* Page 4 */
    .emoji-big { font-size: 55px; margin-bottom: 15px; }

    /* Page 5 */
    .love { font-size: 60px; animation: beating 1.6s infinite; }
    @keyframes beating {
        0% { transform: scale(1); }
        50% { transform: scale(1.18); }
        100% { transform: scale(1); }
    }
</style>
</head>
<body>

<!-- Floating Hearts (same on all pages) -->
<div class="heart" style="top:5%; left:6%;">💗</div>
<div class="heart" style="top:8%; left:70%; animation-delay:1s;">💜</div>
<div class="heart" style="top:15%; left:40%; animation-delay:0.5s;">💕</div>
<div class="heart" style="top:25%; left:85%; animation-delay:1.5s;">💘</div>
<div class="heart" style="top:32%; left:18%; animation-delay:2s;">💗</div>
<div class="heart" style="top:42%; left:60%; animation-delay:0.3s;">💖</div>
<div class="heart" style="top:50%; left:5%; animation-delay:1.8s;">💞</div>
<div class="heart" style="top:53%; left:78%; animation-delay:0.9s;">💓</div>
<div class="heart" style="top:62%; left:33%; animation-delay:1.2s;">💕</div>
<div class="heart" style="top:68%; left:90%; animation-delay:2.3s;">💜</div>

<!-- PAGE 1 -->
<div id="page1" class="page active">
    <div class="card">
        <div class="top-box">
            <img src="hurtmc.gif">
        </div>
        <h2>I know I hurt you... and I've been feeling bad about it.</h2>
        <button class="btn" onclick="goToPage(2)">Next →</button>
    </div>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page">
    <div class="card">
        <div class="top-box">
            <img src="sadcat.gif" class="cat-img">
        </div>
        <h2>I really didn't mean to upset you, Kittu...</h2>
        <button class="btn" onclick="goToPage(3)">Next →</button>
    </div>
</div>

<!-- PAGE 3 -->
<div id="page3" class="page">
    <div class="card">
        <div class="top-box">
            <img src="bunny.gif" class="cute-gif">
        </div>
        <h2>You matter to me a lot... more than you think.</h2>
        <button class="btn" onclick="goToPage(4)">Next →</button>
    </div>
</div>

<!-- PAGE 4 -->
<div id="page4" class="page">
    <div class="card">
        <div class="emoji-big">🥺💗</div>
        <h2>Will you forgive me and make me smile again?</h2>
        <button class="btn" onclick="goToPage(5)">Yes, Next →</button>
    </div>
</div>

<!-- PAGE 5 -->
<div id="page5" class="page">
    <div class="card">
        <div class="love">❤️</div>
        <h2>Thank you Kittu... I love you so much!<br>You’re my everything.</h2>
        <button class="btn" onclick="goToPage(1)">Start Again</button>
    </div>
</div>

<script>
function goToPage(n) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById("page" + n).classList.add('active');
}
</script>

</body>
</html>
